<div class="container">
  <div class="mt-5 mb-5 mx-auto card border-0 shadow-lg rounded-4 p-4 p-md-5" style="max-width: 30rem; background-color: #234677; color: white;">

    <div class="text-center mb-4">
      <h1 class="mb-1">Olá novamente!</h1>
      <p class="mb-0 text-white-50">Entre com sua conta para continuar</p>
    </div>

    @if (message()) {
      <div class="alert alert-danger" role="alert">
        {{ message() }}
      </div>
    }

    <form #formLogin="ngForm">

      <div class="mb-3 input-group">
        <span class="input-group-text">E-mail:</span>
        <input type="email" id="email" name="email" placeholder="seu@email.com" class="form-control"
               [(ngModel)]="login.email" #email="ngModel" required email>
      </div>
      @if (email.errors && enviado()) {
        <div class="alert alert-danger">
          <div [hidden]="!email.errors['required']">Digite o e-mail.</div>
          <div [hidden]="!email.errors['email']">Digite um e-mail válido.</div>
        </div>
      }

      <div class="mb-3 input-group">
        <span class="input-group-text">Senha:</span>
        <input type="password" id="senha" name="senha" placeholder="Sua senha" class="form-control"
               [(ngModel)]="login.senha" #senha="ngModel" required>
      </div>
      @if (senha.errors && enviado()) {
        <div class="alert alert-danger">
          <div [hidden]="!senha.errors['required']">Digite a senha.</div>
        </div>
      }

      <div class="mt-5 d-flex flex-column align-items-center">
        <button type="button" class="btn btn-light rounded-pill px-5 py-2 fw-semibold mb-3"
                (click)="logar()" [disabled]="loading()">
          {{ loading() ? 'Entrando...' : 'Entrar' }}
        </button>
        <a routerLink="/autocadastro" class="text-light text-decoration-underline">Não tenho cadastro</a>
      </div>

    </form>
  </div>
</div>

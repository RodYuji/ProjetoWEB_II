<div class="card mb-3 shadow-sm border-0" style="background-color: #1E3A5F; color: #F5F7FA;">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <div>
        <h5 class="card-title mb-1">{{ descricaoEquipamento }}</h5>
        <p class="card-text text-white-50 mb-0">{{ descricaoDefeito }}</p>
      </div>

      <span
        class="badge rounded-pill px-3 py-2"
        [class.bg-secondary]="status === 'ABERTA'"
        [class.bg-warning]="status === 'ORÇADA'"
        [class.text-dark]="status === 'ORÇADA'"
        [class.bg-success]="status === 'APROVADA' || status === 'FINALIZADA'"
        [class.bg-danger]="status === 'REJEITADA'"
        [class.bg-info]="status === 'ARRUMADA'"
      >
        {{ status }}
      </span>
    </div>

    <p class="small text-white-50 mb-3">{{ data }} às {{ hora }}</p>

    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-outline-light btn-sm" (click)="verDetalhes()">
        Ver detalhes
      </button>

      @if (status === 'ORÇADA') {
        <button class="btn btn-success btn-sm">Aprovar</button>
        <button class="btn btn-outline-danger btn-sm">Rejeitar</button>
      }

      @if (status === 'REJEITADA') {
        <button class="btn btn-warning btn-sm text-dark">Resgatar Serviço</button>
      }

      @if (status === 'ARRUMADA') {
        <button class="btn btn-primary btn-sm" (click)="pagarServico()">Pagar Serviço</button>
      }
    </div>
  </div>
</div>

<div class="card">
    <p>CARD TESTES</p>
    <h3>Detalhes da solicitação</h3>
    <p>Data: {{ solicitacao.data }} </p>
    <p>Hora: {{ solicitacao.hora }}</p>
    <p>Autor: {{ solicitacao.nomeCliente }}</p>
    <p>Descrição: {{ solicitacao.descricao | truncarTexto }}</p>
    <a href="#" title="Efetuar orçamento" class="btn-orcamento"
       [routerLink]="['/efetuar-orcamento', solicitacao.id]">
       Efetuar orçamento
    </a>
</div>

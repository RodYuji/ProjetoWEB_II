<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gerenciamento de Funcionários</h2>

    <button class="btn btn-primary novo-funcionario-btn" (click)="abrirModal()">
      + Novo Funcionário
    </button>
  </div>

  <div class="card">
    <div class="card-body">

      <table class="table table-hover">
        <thead>
          <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>Cargo</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody>
          @for (funcionario of funcionarios; track funcionario) {
            <tr>
              <td>{{ funcionario.nome }}</td>
              <td>{{ funcionario.cpf }}</td>
              <td>{{ funcionario.cargo }}</td>

              <td>
                <button
                  class="btn btn-sm btn-warning me-2"
                  (click)="editarFuncionario(funcionario)">
                  Editar
                </button>

                <button
                  class="btn btn-sm btn-danger"
                  (click)="excluirFuncionario(funcionario)">
                  Excluir
                </button>
              </td>
            </tr>
          }
        </tbody>

      </table>

    </div>
  </div>

</div>

@if (modalAberto) {
  <div class="modal fade show d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Novo Funcionário</h5>
          <button type="button" class="btn-close" (click)="cancelarModal()"></button>
        </div>

        <div class="modal-body">
          <input type="text" class="form-control mb-3" name="nome"
                 placeholder="Digite o nome do funcionário"
                 [(ngModel)]="novoFuncionario.nome">

          <input type="text" class="form-control mb-3" name="cpf"
                 placeholder="000.000.000-00"
                 maxlength="14"
                 [(ngModel)]="novoFuncionario.cpf">

          <select class="form-select" name="cargo"
                  [(ngModel)]="novoFuncionario.cargo">
            <option value="" disabled>Selecione um cargo</option>
            @for (cargo of cargos; track cargo) {
              <option [value]="cargo">{{ cargo }}</option>
            }
          </select>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="cancelarModal()">
            Cancelar
          </button>
          <button type="button" class="btn btn-primary"
                  [disabled]="!formularioValido()"
                  (click)="salvarFuncionario()">
            Salvar
          </button>
        </div>

      </div>
    </div>
  </div>
}

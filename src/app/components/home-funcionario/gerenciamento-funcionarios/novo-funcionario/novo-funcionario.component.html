<div class="pagina-novo-funcionario">
  <a class="btn btn-secondary ms-3 mt-3" href="/gerenciamento-funcionarios">
    <i class="fa fa-arrow-left" aria-hidden="true"></i> Voltar
  </a>
  <div class="mt-5 mb-5 mx-auto card border-0 shadow-lg rounded-4 p-4 p-md-5" style="max-width: 36rem; background-color: #234677; color: white;">

    <div class="text-center mb-4">
      <h1 class="mb-1">Novo Funcionário</h1>
      <p class="mb-0 text-white-50">Informe os dados do funcionário para realizar o cadastro.</p>
    </div>

    <form>

      <div class="input-group mb-3">
        <span class="input-group-text">Nome:</span>
        <input
          type="text"
          id="nome"
          name="nome"
          maxlength="100"
          placeholder="Ex: Maria da Silva"
          class="form-control"
        >
      </div>

      <div class="input-group mb-3">
        <span class="input-group-text">CPF:</span>
        <input
          type="text"
          id="cpf"
          name="cpf"
          maxlength="14"
          placeholder="000.000.000-00"
          class="form-control"
        >
      </div>

      <div class="input-group mb-3">
        <span class="input-group-text">Cargo:</span>
        <select id="cargo" name="cargo" class="form-select">
          <option value="" selected disabled>Selecione um cargo</option>
          <option value="Técnico">Técnico</option>
          <option value="Atendente">Atendente</option>
          <option value="Gerente">Gerente</option>
        </select>
      </div>

      <div class="mt-4 d-flex justify-content-center gap-3">
        <button type="button" class="btn btn-light rounded-pill px-4 py-2 fw-semibold">Registrar Funcionário</button>
        <button type="reset" class="btn btn-outline-light rounded-pill px-4 py-2">Limpar</button>
      </div>

    </form>
  </div>
</div>

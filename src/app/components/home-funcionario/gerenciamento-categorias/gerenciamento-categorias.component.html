<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gerenciamento de Categorias</h2>

    <button class="btn btn-primary nova-categoria-btn" (click)="abrirModal()">
      + Nova Categoria
    </button>
  </div>

  <div class="card">
    <div class="card-body">

      <table class="table table-hover">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody>
          @for (categoria of categorias; track categoria) {
            <tr>
              <td>{{ categoria.nome }}</td>

              <td>
                <button
                  class="btn btn-sm btn-warning me-2"
                  (click)="editarCategoria(categoria)">
                  Editar
                </button>

                <button
                  class="btn btn-sm btn-danger"
                  (click)="excluirCategoria(categoria)">
                  Excluir
                </button>
              </td>
            </tr>
          }
        </tbody>

      </table>

    </div>
  </div>

</div>

@if (modalAberto) {
  <div class="modal fade show d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Nova Categoria</h5>
          <button type="button" class="btn-close" (click)="cancelarModal()"></button>
        </div>

        <div class="modal-body">
          <input type="text" class="form-control" name="nome"
                 placeholder="Digite o nome da categoria"
                 [(ngModel)]="novaCategoria.nome"
                 (keyup.enter)="salvarCategoria()">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="cancelarModal()">
            Cancelar
          </button>
          <button type="button" class="btn btn-primary"
                  [disabled]="!novaCategoria.nome.trim()"
                  (click)="salvarCategoria()">
            Salvar
          </button>
        </div>

      </div>
    </div>
  </div>
}
